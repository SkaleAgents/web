name: CI

on:
  workflow_dispatch:
  # PRs only: a squash merge to main is the commit the PR already tested.
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

# Only the newest revision of each PR or branch needs to finish CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8082

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E smokes
        run: pnpm test:e2e
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8082
